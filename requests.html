<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заявки преподавателей - Склад</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-image: url('background.jpg'); background-size: cover; background-position: center; background-attachment: fixed; min-height: 100vh; color: white; }
        
        header { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding: 0 40px; height: 70px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        header h1 { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 12px; }
        header h1 i { color: #4ade80; font-size: 24px; }
        .user-info { display: flex; align-items: center; gap: 20px; font-size: 14px; font-weight: 500; }
        .logout-btn { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); color: white; padding: 8px 16px; border-radius: 8px; cursor: pointer; transition: 0.2s; text-decoration: none; font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 8px; }
        .logout-btn:hover { background: rgba(239, 68, 68, 0.2); border-color: #ef4444; color: #fca5a5; }

        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        .back-link { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 20px; color: #cbd5e1; text-decoration: none; font-size: 14px; font-weight: 500; transition: 0.2s; }
        .back-link:hover { color: #4ade80; }
        
        .page-title { margin-bottom: 25px; font-size: 26px; font-weight: 700; color: white; }
        
        .table-container { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(12px); border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.1); }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th { padding: 18px 20px; text-align: left; font-weight: 600; color: #94a3b8; text-transform: uppercase; font-size: 12px; border-bottom: 2px solid rgba(255, 255, 255, 0.1); background: rgba(0,0,0,0.2); }
        td { padding: 16px 20px; text-align: left; border-bottom: 1px solid rgba(255, 255, 255, 0.05); color: #e2e8f0; font-weight: 500; vertical-align: middle; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background-color: rgba(255, 255, 255, 0.05); }
        
        .badge { padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; display: inline-block; }
        .badge-wait { background: rgba(245, 158, 11, 0.2); color: #fcd34d; border: 1px solid rgba(245, 158, 11, 0.3); }
        .badge-ok { background: rgba(74, 222, 128, 0.15); color: #4ade80; border: 1px solid rgba(74, 222, 128, 0.3); }
        .badge-cancel { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); }

        .btn { padding: 8px 14px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; transition: 0.2s; }
        .btn-approve { background: #4ade80; color: #064e3b; }
        .btn-approve:hover { background: #22c55e; box-shadow: 0 4px 10px rgba(74, 222, 128, 0.3); }
        .btn-reject { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); }
        .btn-reject:hover { background: rgba(239, 68, 68, 0.4); }
        .btn-undo { background: rgba(255, 255, 255, 0.1); color: #cbd5e1; border: 1px solid rgba(255, 255, 255, 0.2); }
        .btn-undo:hover { background: rgba(255, 255, 255, 0.2); color: white; }
        
        .action-buttons { display: flex; gap: 8px; }
    </style>
</head>
<body>

    <header>
        <h1><i class="fas fa-cubes"></i> Управление складом</h1>
        <div class="user-info">
            <span style="color: #4ade80; background: rgba(74, 222, 128, 0.1); padding: 6px 12px; border-radius: 20px; border: 1px solid rgba(74, 222, 128, 0.2);">Кладовщик</span>
            <a href="login.html" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Выйти</a>
        </div>
    </header>

    <div class="container">
        <a href="dashboard.html" class="back-link"><i class="fas fa-arrow-left"></i> Вернуться на главную</a>
        <h2 class="page-title">Заявки преподавателей</h2>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Дата</th>
                        <th>От кого</th>
                        <th>Товар</th>
                        <th>Кол-во</th>
                        <th>Статус</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="requestsTableBody">
                    <!-- Заявки генерируются скриптом -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Загружаем заявки из памяти
        let requests = JSON.parse(localStorage.getItem('warehouseRequests')) || [];

        // Если заявок нет, добавим пару тестовых для наглядности
        if (requests.length === 0) {
            requests = [
                { id: 1, date: "12.11.2026", author: "Иванова А.С. (Математика)", product: "Бумага А4 \"Снегурочка\"", qty: "5 пачек", status: "wait" },
                { id: 2, date: "12.11.2026", author: "Петров В.И. (Физика)", product: "Ручка шариковая синяя", qty: "2 шт.", status: "wait" },
                { id: 3, date: "11.11.2026", author: "Сидорова Е.П. (Русский язык)", product: "Тетрадь 48 л.", qty: "10 шт.", status: "ok" }
            ];
            localStorage.setItem('warehouseRequests', JSON.stringify(requests));
        }

        function renderRequests() {
            const tbody = document.getElementById('requestsTableBody');
            tbody.innerHTML = '';

            requests.forEach((req) => {
                let statusHtml = '';
                let actionsHtml = '';

                if (req.status === 'wait') {
                    statusHtml = `<span class="badge badge-wait">Ожидает</span>`;
                    actionsHtml = `
                        <button class="btn btn-approve" onclick="updateStatus(${req.id}, 'ok')"><i class="fas fa-check"></i> Выдать</button>
                        <button class="btn btn-reject" onclick="updateStatus(${req.id}, 'cancel')"><i class="fas fa-times"></i> Отклонить</button>
                    `;
                } else if (req.status === 'ok') {
                    statusHtml = `<span class="badge badge-ok">Выдано</span>`;
                    actionsHtml = `<button class="btn btn-undo" onclick="updateStatus(${req.id}, 'wait')"><i class="fas fa-undo"></i> Вернуть</button>`;
                } else if (req.status === 'cancel') {
                    statusHtml = `<span class="badge badge-cancel">Отклонено</span>`;
                    actionsHtml = `<button class="btn btn-undo" onclick="updateStatus(${req.id}, 'wait')"><i class="fas fa-undo"></i> Вернуть</button>`;
                }

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${req.date}</td>
                    <td>${req.author}</td>
                    <td>${req.product}</td>
                    <td>${req.qty}</td>
                    <td class="status-cell">${statusHtml}</td>
                    <td class="action-buttons">${actionsHtml}</td>
                `;
                tbody.appendChild(row);
            });
        }

        function updateStatus(id, newStatus) {
            const reqIndex = requests.findIndex(r => r.id === id);
            if (reqIndex !== -1) {
                requests[reqIndex].status = newStatus;
                localStorage.setItem('warehouseRequests', JSON.stringify(requests));
                renderRequests(); // Перерисовываем таблицу
            }
        }

        // Запускаем отрисовку при загрузке страницы
        document.addEventListener("DOMContentLoaded", renderRequests);
    </script>
</body>
</html>
