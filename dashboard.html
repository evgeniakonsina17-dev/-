<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет - Склад</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        
        body { 
            background-image: url('background.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            color: white;
        }
        
        header {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            color: white; padding: 0 40px; height: 70px;
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 100;
        }
        header h1 { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 12px; color: white; }
        header h1 i { color: #4ade80; font-size: 24px; }
        
        .user-info { display: flex; align-items: center; gap: 15px; font-size: 14px; font-weight: 500; }
        
        .role-badge {
            color: #4ade80; background: rgba(74, 222, 128, 0.1); padding: 6px 12px; 
            border-radius: 20px; border: 1px solid rgba(74, 222, 128, 0.2);
        }

        .logout-btn {
            background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); 
            color: white; padding: 8px 16px; border-radius: 8px; cursor: pointer; 
            transition: 0.2s; text-decoration: none; font-weight: 600; font-size: 13px; 
            display: flex; align-items: center; gap: 8px;
        }
        .logout-btn:hover { background: rgba(239, 68, 68, 0.2); border-color: #ef4444; color: #fca5a5; }

        /* Стиль для кнопки Помощь */
        .help-btn {
            background: transparent; border: 1px solid #4ade80; color: #4ade80;
            padding: 8px 16px; border-radius: 8px; cursor: pointer; transition: 0.2s;
            text-decoration: none; font-weight: 600; font-size: 13px;
            display: flex; align-items: center; gap: 8px;
        }
        .help-btn:hover { background: #4ade80; color: #064e3b; box-shadow: 0 4px 10px rgba(74, 222, 128, 0.3); }

        .container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
        
        .welcome-box {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(12px);
            padding: 35px; border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-left: 6px solid #4ade80;
            margin-bottom: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .welcome-box h2 { margin-bottom: 8px; color: white; font-size: 24px; }
        .welcome-box p { color: #cbd5e1; font-size: 15px; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; }
        
        .card {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(10px);
            padding: 30px; border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center; display: flex; flex-direction: column; align-items: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2);
        }
        .card:hover {
            transform: translateY(-5px);
            background: rgba(15, 23, 42, 0.8);
            border-color: rgba(74, 222, 128, 0.3);
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
        }
        
        .card-icon {
            width: 70px; height: 70px; background: rgba(74, 222, 128, 0.1); 
            border-radius: 50%; display: flex; justify-content: center; align-items: center; 
            margin-bottom: 20px; color: #4ade80; font-size: 28px; transition: 0.3s;
            border: 1px solid rgba(74, 222, 128, 0.2);
        }
        .card:hover .card-icon { background: #4ade80; color: #064e3b; transform: scale(1.1); }
        
        .card h3 { font-size: 18px; margin-bottom: 10px; color: white; }
        .card p { font-size: 14px; color: #94a3b8; margin-bottom: 25px; flex-grow: 1; line-height: 1.5; }
        
        .card-btn {
            display: inline-block; padding: 12px 24px; background: rgba(74, 222, 128, 0.15); 
            color: #4ade80; border: 1px solid #4ade80;
            text-decoration: none; border-radius: 10px; font-weight: 600; font-size: 14px;
            transition: 0.2s; width: 100%;
        }
        .card-btn:hover { background: #4ade80; color: #064e3b; box-shadow: 0 4px 15px rgba(74, 222, 128, 0.3); }
    </style>
</head>
<body>

    <header>
        <h1><i class="fas fa-cubes"></i> Управление складом</h1>
        <div class="user-info">
            <span id="userRoleDisplay" class="role-badge">Загрузка...</span>
            
            <!-- ВОТ ОНА, КНОПКА ПОМОЩИ -->
            <a href="guide.html" class="help-btn"><i class="fas fa-question-circle"></i> Помощь</a>
            
            <a href="login.html" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Выйти</a>
        </div>
    </header>

    <div class="container">
        <div class="welcome-box">
            <h2>Добро пожаловать! 👋</h2>
            <p id="welcomeText">Вы вошли в систему. Выберите нужный раздел.</p>
        </div>

        <div class="grid" id="menuGrid">
            <!-- Карточки генерируются скриптом -->
        </div>
    </div>

    <script>
        let currentRole = localStorage.getItem('userRole');
        if (!currentRole) { window.location.href = 'login.html'; }

        const roleNames = { 'admin': 'Кладовщик', 'teacher': 'Преподаватель', 'management': 'Руководство' };
        document.getElementById('userRoleDisplay').innerText = roleNames[currentRole];

        const grid = document.getElementById('menuGrid');
        let htmlContent = '';

        if (currentRole === 'admin') {
            document.getElementById('welcomeText').innerText = 'Вам доступно управление товарами и заявками.';
            htmlContent = `
                <div class="card">
                    <div class="card-icon"><i class="fas fa-list-ul"></i></div>
                    <h3>Справочник товаров</h3>
                    <p>Добавление и редактирование остатков на складе</p>
                    <a href="warehouse.html" class="card-btn">Перейти</a>
                </div>
                <div class="card">
                    <div class="card-icon"><i class="fas fa-clipboard-check"></i></div>
                    <h3>Заявки преподавателей</h3>
                    <p>Подтверждение, выдача или отклонение заявок</p>
                    <a href="requests.html" class="card-btn">Перейти</a>
                </div>
                <div class="card">
                    <div class="card-icon"><i class="fas fa-chart-pie"></i></div>
                    <h3>Аналитика и отчеты</h3>
                    <p>Просмотр расхода за период и экспорт</p>
                    <a href="reports.html" class="card-btn">Перейти</a>
                </div>
            `;
        } else if (currentRole === 'teacher') {
            document.getElementById('welcomeText').innerText = 'Вы можете просматривать остатки и заказывать материалы.';
            htmlContent = `
                <div class="card">
                    <div class="card-icon"><i class="fas fa-search"></i></div>
                    <h3>Просмотр склада</h3>
                    <p>Узнать, что есть в наличии в данный момент</p>
                    <a href="teacher_warehouse.html" class="card-btn">Перейти</a>
                </div>
                <div class="card">
                    <div class="card-icon"><i class="fas fa-paper-plane"></i></div>
                    <h3>Подать заявку</h3>
                    <p>Заказать канцелярию или инвентарь для работы</p>
                    <a href="teacher_request.html" class="card-btn">Перейти</a>
                </div>
            `;
        } else if (currentRole === 'management') {
            document.getElementById('welcomeText').innerText = 'Вам доступна общая аналитика и управление сотрудниками.';
            htmlContent = `
                <div class="card">
                    <div class="card-icon"><i class="fas fa-file-invoice-dollar"></i></div>
                    <h3>Общие отчеты</h3>
                    <p>Анализ расхода ресурсов колледжа за период</p>
                    <a href="management_reports.html" class="card-btn">Перейти</a>
                </div>
                <div class="card">
                    <div class="card-icon"><i class="fas fa-users-cog"></i></div>
                    <h3>Сотрудники</h3>
                    <p>Список пользователей системы и их права</p>
                    <a href="management_staff.html" class="card-btn">Перейти</a>
                </div>
            `;
        }
        grid.innerHTML = htmlContent;
    </script>
</body>
</html>
